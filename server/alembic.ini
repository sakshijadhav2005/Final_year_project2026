# Alembic is initialized in Stage 2 when auth tables are applied.
# Keep this file so `alembic init` layout is already reserved.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = postgresql://eventai:eventai@localhost:5432/eventai

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
